[workspace]
resolver = "3"
members = ["crates/*", "src-tauri", "perf"]
default-members = ["crates/*", "src-tauri", "perf"]
# Vendored third-party crates are dependencies, not members.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/daler-sodikov/openWeb"
authors = ["Ferrule contributors"]
publish = false

[workspace.dependencies]
# internal crates
ferrule-buffer = { path = "crates/buffer" }
ferrule-vfs = { path = "crates/vfs" }
ferrule-settings = { path = "crates/settings" }
ferrule-project = { path = "crates/project" }
ferrule-syntax = { path = "crates/syntax" }
ferrule-lang-js = { path = "crates/lang-js" }
ferrule-lang-css = { path = "crates/lang-css" }
ferrule-lang-html = { path = "crates/lang-html" }
ferrule-lang-yaml = { path = "crates/lang-yaml" }
ferrule-lang-markdown = { path = "crates/lang-markdown" }
ferrule-indexer = { path = "crates/indexer" }
ferrule-search = { path = "crates/search" }
ferrule-lsp-client = { path = "crates/lsp-client" }
ferrule-dap-client = { path = "crates/dap-client" }
ferrule-git = { path = "crates/git" }
ferrule-terminal = { path = "crates/terminal" }
ferrule-run-debug = { path = "crates/run-debug" }
ferrule-plugin-host = { path = "crates/plugin-host" }
ferrule-ipc = { path = "crates/ipc" }
ferrule-core = { path = "crates/core" }

# external crates (versions chosen in M0; see THIRD_PARTY_LICENSES.md)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tauri = "2.12"
tauri-build = "2.7"
# Pre-release crates: pinned with `=` as required by tauri-specta during its RC phase.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tempfile = "3"
# M1
ropey = { version = "1.6", default-features = false, features = ["simd"] }
tree-sitter = "0.27"
streaming-iterator = "0.1"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = "0.7"
tauri-plugin-dialog = "2"
tiny_http = "0.12"
# M2
ignore = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
regex = "1"
# M2b
tree-sitter-scss = "1"
tree-sitter-less = "1"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-svelte-ng = "1"
globset = "0.4"
x11rb = { version = "0.14", features = ["xtest"] }
# M3
lsp-types = "0.97"
url = "2"
pulldown-cmark = { version = "0.13", default-features = false }
# M3b: in-process import analysis
oxc_allocator = "0.157"
oxc_ast = "0.157"
oxc_parser = "0.157"
oxc_semantic = "0.157"
oxc_span = "0.157"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# tree-sitter-scss 1.0.0 with an MSVC-compatible build script (see
# third_party/tree-sitter-scss/VENDORED.md).
[patch.crates-io]
tree-sitter-scss = { path = "third_party/tree-sitter-scss" }
