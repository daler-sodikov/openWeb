[package]
name = "ferrule-app"
description = "Ferrule desktop shell: Tauri window setup and the typed IPC command layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "ferrule"

[lib]
name = "ferrule_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ferrule"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

# Headless backend for Playwright UI tests (docs/ARCHITECTURE.md, section 7).
[[bin]]
name = "ferrule-headless"
path = "src/bin/headless.rs"
required-features = ["headless"]

[features]
default = ["native"]
# Real terminals (PTY + VT emulator). Off only for offline tooling that does
# not need them (exporting the IPC bindings).
native = ["ferrule-terminal/native"]
# The test backend; also offers the in-memory terminal (`--fake-terminals`).
headless = ["tauri/test", "dep:tiny_http", "ferrule-terminal/testing"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
ferrule-core.workspace = true
ferrule-ipc.workspace = true
ferrule-terminal.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http = { workspace = true, optional = true }
tauri-plugin-dialog.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
