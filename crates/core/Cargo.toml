[package]
name = "ferrule-core"
description = "Application core: sessions, services and the wiring between all domain crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ferrule-ipc.workspace = true
ferrule-buffer.workspace = true
ferrule-vfs.workspace = true
ferrule-settings.workspace = true
ferrule-project.workspace = true
ferrule-syntax.workspace = true
ferrule-lang-js.workspace = true
ferrule-lang-css.workspace = true
ferrule-lang-html.workspace = true
ferrule-lang-yaml.workspace = true
ferrule-lang-markdown.workspace = true
ferrule-indexer.workspace = true
ferrule-search.workspace = true
ferrule-lsp-client.workspace = true
ferrule-dap-client.workspace = true
ferrule-git.workspace = true
ferrule-terminal.workspace = true
ferrule-run-debug.workspace = true
ferrule-cdp-client.workspace = true
ferrule-plugin-host.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
pulldown-cmark.workspace = true

# Test diagnostics only (Restart Manager, see tests/integration/cleanup.rs).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_RestartManager"] }

[features]
# The scripted debugger (`fake_debug`) for tests and the headless binary.
testing = ["ferrule-run-debug/testing"]

[dev-dependencies]
# Itself, to turn `testing` on for this crate's own tests.
ferrule-core = { workspace = true, features = ["testing"] }
ferrule-terminal = { workspace = true, features = ["testing", "native"] }
ferrule-run-debug = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
