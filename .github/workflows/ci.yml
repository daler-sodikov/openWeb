name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install the fixture's dependencies (React types for UI tests)
        run: bun install --frozen-lockfile --cwd fixtures/react-ts

      # Real-server tests (crates/core/tests/lsp_real.rs, e2e/ui/lsp.spec.ts)
      # need Node and typescript-language-server; they fail instead of
      # skipping when FERRULE_REQUIRE_TS_SERVER is set.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install the TypeScript language server
        shell: bash
        run: |
          bun add -g typescript-language-server@6.0.3 typescript@6.0.3
          bun pm bin -g >> "$GITHUB_PATH"

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy (headless UI-test backend)
        run: cargo clippy -p ferrule-app --features headless --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
        env:
          FERRULE_REQUIRE_TS_SERVER: "1"

      - name: ESLint
        run: bun run lint

      - name: Prettier
        if: runner.os == 'Linux'
        run: bun run format:check

      - name: TypeScript
        run: bun run typecheck

      - name: Vitest
        run: bun run test

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Playwright end-to-end (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a bunx playwright test

      - name: Playwright end-to-end
        if: runner.os != 'Linux'
        run: bunx playwright test

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: [check, deny]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build release bundles
        run: bun tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: ferrule-${{ matrix.os }}
          path: target/release/bundle/
          if-no-files-found: error
